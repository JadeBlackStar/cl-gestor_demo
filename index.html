<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808"><title>CL Gestor · Casa Lora</title>
<style>
:root{--fondo:#080808;--panel:#111111;--panel2:#191919;--line:#292929;--txt:#f2f0ec;--muted:#92918e;--oro:#c6a878;--verde:#82b69a;--rojo:#d78383;--sombra:0 18px 55px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#181512 0,transparent 36%),var(--fondo);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.12)}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:25px 17px;border-right:1px solid var(--line);background:#0b0b0be8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:8px 12px 28px}.brand img{width:43px;height:43px;object-fit:contain;filter:invert(1);opacity:.9}.brand strong{letter-spacing:3px;font-size:15px}.brand small{display:block;color:var(--muted);letter-spacing:2px;font-size:9px;margin-top:5px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);border:0;text-align:left;padding:13px 15px;border-radius:10px;display:flex;gap:13px;align-items:center}.nav button.active{background:#1b1916;color:var(--oro);border:1px solid #30271c}.nav button span:first-child{width:20px;text-align:center}.sidefoot{margin-top:auto;color:#666;font-size:11px;padding:15px 12px;line-height:1.6}.main{min-width:0;padding:30px clamp(18px,4vw,50px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px}.top h1{font-size:24px;font-weight:500;letter-spacing:.5px;margin:0}.top p{color:var(--muted);margin:7px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:10px 14px;border-radius:10px}.btn.gold{background:var(--oro);color:#15110b;border-color:var(--oro);font-weight:650}.btn.danger{color:var(--rojo)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}.card,.box{border:1px solid var(--line);background:linear-gradient(145deg,#151515,#101010);border-radius:16px;padding:19px;box-shadow:var(--sombra)}.card .label{color:var(--muted);font-size:10px;letter-spacing:1.6px;text-transform:uppercase}.card .value{font-size:25px;margin-top:12px;font-weight:550;letter-spacing:.2px}.card .note{color:var(--muted);font-size:11px;margin-top:8px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.box h2{font-size:14px;font-weight:550;margin:0 0 17px;letter-spacing:.4px}.tablewrap{overflow:auto;max-height:500px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:12px 11px;border-bottom:1px solid #252525;font-size:12px}th{color:var(--muted);font-size:10px;letter-spacing:1px;font-weight:500;position:sticky;top:0;background:#141414}td{color:#e7e4df}tr:hover td{background:#171717}.empty{text-align:center;color:var(--muted);padding:35px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select{background:#191919;color:var(--txt);border:1px solid #333;border-radius:9px;padding:10px 12px;outline:none}.toolbar input:focus,.field input:focus,.field select:focus{border-color:var(--oro)}.toolbar input{flex:1;min-width:170px}.pill{border:1px solid #393939;border-radius:30px;padding:4px 8px;color:var(--muted);font-size:10px}.green{color:var(--verde)}.red{color:var(--rojo)}.goldtxt{color:var(--oro)}.hidden{display:none!important}.page{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.modalbg{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#141414;border:1px solid #353535;border-radius:18px;padding:23px;box-shadow:0 25px 80px #000}.modal h2{margin:0 0 20px;font-size:18px;font-weight:500}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.field input,.field select{width:100%}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:22px;right:22px;background:#24221e;border:1px solid #554630;padding:13px 17px;border-radius:12px;color:var(--txt);z-index:20;animation:fade .25s}.login{min-height:100vh;display:grid;place-items:center;padding:25px}.loginbox{width:min(420px,100%);padding:35px;background:#111;border:1px solid #2b2b2b;border-radius:20px;text-align:center}.loginbox img{width:120px;height:90px;object-fit:contain;filter:invert(1);opacity:.9}.loginbox h1{letter-spacing:4px;font-size:20px;font-weight:500}.loginbox p{color:var(--muted);font-size:12px;line-height:1.6}.loginbox .field{text-align:left;margin:18px 0}.loginbox button{width:100%}.warning{background:#1b1712;border:1px solid #473727;color:#bca786;border-radius:10px;padding:11px;font-size:11px;line-height:1.5;margin-top:16px}.chart{height:170px;display:flex;align-items:end;gap:7px;padding:15px 0}.bar{flex:1;min-width:8px;background:linear-gradient(#c6a878,#735d3c);border-radius:5px 5px 0 0;position:relative;transition:height .4s}.bar small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:9px}.quick{display:flex;gap:9px;flex-wrap:wrap}.quick .btn{flex:1}.footnote{font-size:11px;color:var(--muted);line-height:1.6}.mobilehead{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.shell{grid-template-columns:210px 1fr}.main{padding:25px}}
@media(max-width:720px){.shell{display:block}.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:5;border:0;border-top:1px solid var(--line);padding:6px;background:#0a0a0af2;display:block}.brand,.sidefoot{display:none}.nav{display:flex;justify-content:space-around;gap:0}.nav button{padding:10px 5px;flex-direction:column;gap:4px;font-size:10px;flex:1;border-radius:8px}.nav button span:first-child{font-size:17px}.main{padding:20px 15px 100px}.top{align-items:flex-start}.top h1{font-size:21px}.top .actions{display:none}.cards{gap:9px}.card{padding:14px}.card .value{font-size:20px}.card .label{font-size:9px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.box{padding:15px}.toolbar select{max-width:100%}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><img src="casa_lora_logo.png" alt="Casa Lora"><h1>CL GESTOR</h1><p>GESTIÓN PRIVADA · CASA LORA</p><div class="field"><label>Correo electrónico</label><input id="correoInput" type="email" placeholder="correo@ejemplo.com" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="claveInput" type="password" placeholder="Tu contraseña" autocomplete="current-password"></div><div class="field"><label>Nombre de perfil (opcional)</label><input id="perfilInput" placeholder="Ej. Casa Lora" value="Casa Lora"></div><button class="btn gold" onclick="entrar()">Iniciar sesión</button><button class="btn" style="margin-top:9px" onclick="registrarse()">Crear cuenta</button><div class="warning">Acceso con cuenta y sincronización entre dispositivos. Configura primero tu proyecto Supabase siguiendo el archivo LEEME.</div></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><img src="casa_lora_logo.png"><div><strong>CASA LORA</strong><small>CL GESTOR</small></div></div><nav class="nav" id="nav"><button data-page="inicio" class="active"><span>◈</span><span>Inicio</span></button><button data-page="inventario"><span>▤</span><span>Inventario</span></button><button data-page="clientes"><span>♙</span><span>Clientes</span></button><button data-page="ventas"><span>↗</span><span>Ventas</span></button><button data-page="egresos"><span>↘</span><span>Egresos</span></button><button data-page="balance"><span>▥</span><span>Balance</span></button></nav><div class="sidefoot">CASA LORA · SINCRONIZADO<br><span id="perfilLabel"></span><br><span id="estadoSync">Conectando…</span><br><button class="btn" style="margin-top:10px" onclick="salir()">Cerrar sesión</button></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Resumen general</h1><p id="pageSub">Una mirada al estado de Casa Lora.</p></div><div class="actions"><button class="btn" onclick="exportar()">Exportar respaldo</button><button class="btn gold" onclick="modalRapido()">＋ Nuevo registro</button></div></div><section id="inicio" class="page"></section><section id="inventario" class="page hidden"></section><section id="clientes" class="page hidden"></section><section id="ventas" class="page hidden"></section><section id="egresos" class="page hidden"></section><section id="balance" class="page hidden"></section></main></div><div id="modalbg" class="modalbg hidden" onclick="if(event.target===this)cerrarModal()"><div class="modal" id="modal"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Configura estos datos desde el proyecto Supabase (ver LEEME).
const SUPABASE_URL="PON_AQUI_TU_URL"; const SUPABASE_ANON_KEY="PON_AQUI_TU_ANON_KEY";
let clienteNube=null, usuarioNube=null, temporizadorSync=null;
if(window.supabase && SUPABASE_URL.startsWith("https://") && !SUPABASE_ANON_KEY.includes("PON_AQUI")){clienteNube=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}
const CLAVE='clgestor_v1';let datos={productos:[],clientes:[],ventas:[],egresos:[],cortes:[]},perfil='',pagina='inicio';const moneda=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(n||0));const fecha=()=>new Date().toISOString().slice(0,10);const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);const categorias=['Compra de stock','Renta','Servicios','Empaques / frascos','Encargos especiales','Envíos / fletes','Varios'];
function guardar(){localStorage.setItem(CLAVE,JSON.stringify({perfil,datos}));if(usuarioNube&&clienteNube){clearTimeout(temporizadorSync);temporizadorSync=setTimeout(sincronizarNube,900)}}
function cargar(){try{let s=JSON.parse(localStorage.getItem(CLAVE)||'{}');datos=s.datos||datos;perfil=s.perfil||''}catch{}}
function mostrarGestor(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('perfilLabel').textContent=perfil;renderAll();activarTiempoReal()}
async function entrar(){if(!clienteNube)return toast('Configura Supabase primero. Consulta LEEME.');let correo=document.getElementById('correoInput').value.trim(),clave=document.getElementById('claveInput').value;if(!correo||!clave)return toast('Ingresa correo y contraseña');document.getElementById('estadoSync').textContent='Autenticando…';let {data,error}=await clienteNube.auth.signInWithPassword({email:correo,password:clave});if(error){toast(error.message);return}usuarioNube=data.user;perfil=document.getElementById('perfilInput').value.trim()||correo.split('@')[0];await cargarNube();mostrarGestor();}
async function registrarse(){if(!clienteNube)return toast('Configura Supabase primero. Consulta LEEME.');let correo=document.getElementById('correoInput').value.trim(),clave=document.getElementById('claveInput').value;if(!correo||clave.length<8)return toast('Correo válido y contraseña de al menos 8 caracteres');let {data,error}=await clienteNube.auth.signUp({email:correo,password:clave});if(error){toast(error.message);return}if(data.user&&!data.session){toast('Revisa tu correo para confirmar la cuenta.');return}usuarioNube=data.user;perfil=document.getElementById('perfilInput').value.trim()||correo.split('@')[0];datos={productos:[],clientes:[],ventas:[],egresos:[],cortes:[]};mostrarGestor();await sincronizarNube();}
async function cargarNube(){document.getElementById('estadoSync').textContent='Descargando datos…';let {data,error}=await clienteNube.from('cl_gestor_datos').select('datos').eq('usuario_id',usuarioNube.id).maybeSingle();if(error){toast('Error al cargar datos: '+error.message);return}if(data?.datos){datos=data.datos;localStorage.setItem(CLAVE,JSON.stringify({perfil,datos}))}else{cargar();await sincronizarNube()}document.getElementById('estadoSync').textContent='Sincronizado'}
let canalNube=null;function activarTiempoReal(){if(!clienteNube||!usuarioNube)return;if(canalNube)clienteNube.removeChannel(canalNube);canalNube=clienteNube.channel('clgestor-'+usuarioNube.id).on('postgres_changes',{event:'*',schema:'public',table:'cl_gestor_datos',filter:'usuario_id=eq.'+usuarioNube.id},async()=>{if(!temporizadorSync){let {data}=await clienteNube.from('cl_gestor_datos').select('datos').eq('usuario_id',usuarioNube.id).maybeSingle();if(data?.datos){datos=data.datos;localStorage.setItem(CLAVE,JSON.stringify({perfil,datos}));renderAll();document.getElementById('estadoSync').textContent='Actualizado desde otro dispositivo'}}}).subscribe();}
async function sincronizarNube(){if(!clienteNube||!usuarioNube)return;document.getElementById('estadoSync').textContent='Sincronizando…';let {error}=await clienteNube.from('cl_gestor_datos').upsert({usuario_id:usuarioNube.id,datos,actualizado_en:new Date().toISOString()},{onConflict:'usuario_id'});document.getElementById('estadoSync').textContent=error?'Error de sincronización':'Sincronizado';if(error)console.error(error)}
async function salir(){if(clienteNube){if(canalNube)await clienteNube.removeChannel(canalNube);await clienteNube.auth.signOut()}usuarioNube=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('perfilInput').value=perfil}
function nav(p){pagina=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));let tit={inicio:['Resumen general','Una mirada al estado de Casa Lora.'],inventario:['Inventario','Productos, existencias y precios.'],clientes:['Clientes','Directorio y cuentas por cobrar.'],ventas:['Ventas','Registro y seguimiento de operaciones.'],egresos:['Egresos','Control de gastos operativos.'],balance:['Balance','Cortes y resultados acumulados.']};document.getElementById('pageTitle').textContent=tit[p][0];document.getElementById('pageSub').textContent=tit[p][1];renderPage(p)}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)nav(b.dataset.page)});
function totalVentas(){return datos.ventas.reduce((a,v)=>a+v.total,0)}function totalCobrado(){return datos.ventas.reduce((a,v)=>a+v.cobrado,0)}function porCobrar(){return datos.ventas.reduce((a,v)=>a+v.saldo,0)}function totalEgresos(){return datos.egresos.reduce((a,e)=>a+e.monto,0)}function costoVendido(){return datos.ventas.reduce((a,v)=>a+(v.costoUnitario||0)*v.cantidad,0)}function utilidadEst(){return totalCobrado()-totalEgresos()-costoVendido()}
function card(t,v,n='',cl=''){return `<div class="card"><div class="label">${t}</div><div class="value ${cl}">${v}</div><div class="note">${n}</div></div>`}function tabla(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Sin registros todavía</td></tr>`}</tbody></table></div>`}function renderAll(){['inicio','inventario','clientes','ventas','egresos','balance'].forEach(renderPage)}function renderPage(p){if(!document.getElementById(p))return;switch(p){case'inicio':renderInicio();break;case'inventario':renderInventario();break;case'clientes':renderClientes();break;case'ventas':renderVentas();break;case'egresos':renderEgresos();break;case'balance':renderBalance();}}
function renderInicio(){let recientes=[...datos.ventas.map(v=>({fecha:v.fecha,tipo:'Venta',detalle:v.producto,monto:v.total})),...datos.egresos.map(e=>({fecha:e.fecha,tipo:'Egreso',detalle:e.categoria,monto:e.monto}))].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8);let meses=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});let vmes=meses.map(m=>datos.ventas.filter(v=>v.fecha.startsWith(m)).reduce((s,v)=>s+v.total,0));let max=Math.max(...vmes,1);document.getElementById('inicio').innerHTML=`<div class="cards">${card('Ventas registradas',moneda(totalVentas()),datos.ventas.length+' operaciones','goldtxt')}${card('Cobrado',moneda(totalCobrado()),'Pagos recibidos','green')}${card('Egresos',moneda(totalEgresos()),'Gastos registrados','red')}${card('Por cobrar',moneda(porCobrar()),'Saldo de créditos','goldtxt')}</div><div class="grid2"><div class="box"><h2>Ventas · últimos seis meses</h2><div class="chart">${vmes.map((v,i)=>`<div class="bar" style="height:${Math.max(4,v/max*100)}%"><small>${meses[i].slice(5)}</small></div>`).join('')}</div><p class="footnote">Visualización simple basada en las ventas registradas.</p></div><div class="box"><h2>Acciones rápidas</h2><div class="quick"><button class="btn gold" onclick="abrirFormulario('venta')">＋ Registrar venta</button><button class="btn" onclick="abrirFormulario('producto')">＋ Producto</button><button class="btn" onclick="abrirFormulario('cliente')">＋ Cliente</button><button class="btn" onclick="abrirFormulario('egreso')">＋ Egreso</button><button class="btn" onclick="exportar()">↓ Respaldo</button><button class="btn" onclick="importar()">↑ Restaurar</button></div><p class="footnote" style="margin-top:18px">Utilidad estimada: cobros menos egresos y costo estimado de productos vendidos.</p></div></div><div class="box" style="margin-top:15px"><h2>Actividad reciente</h2>${tabla(['FECHA','TIPO','DETALLE','IMPORTE'],recientes.map(x=>`<tr><td>${x.fecha}</td><td>${x.tipo}</td><td>${x.detalle}</td><td>${moneda(x.monto)}</td></tr>`))}</div>`}
function renderInventario(){let filtro=document.getElementById('fInv')?.value.toLowerCase()||'';let lista=datos.productos.filter(x=>(x.nombre+' '+x.marca+' '+x.id).toLowerCase().includes(filtro));document.getElementById('inventario').innerHTML=`<div class="toolbar"><input id="fInv" placeholder="Buscar perfume, marca o ID…" value="${filtro}" oninput="renderInventario()"><button class="btn gold" onclick="abrirFormulario('producto')">＋ Añadir producto</button></div><div class="box">${tabla(['ID','PERFUME','MARCA','COSTO','PRECIO','STOCK','ACCIONES'],lista.map(x=>`<tr><td>${x.id}</td><td>${x.nombre}</td><td>${x.marca||'—'}</td><td>${moneda(x.costo)}</td><td>${moneda(x.precio)}</td><td class="${x.stock<=2?'red':''}">${x.stock}</td><td><button class="btn" onclick="editar('producto','${x.id}')">Editar</button> <button class="btn danger" onclick="borrar('producto','${x.id}')">×</button></td></tr>`))}</div>`}
function renderClientes(){let f=document.getElementById('fCli')?.value.toLowerCase()||'';let lista=datos.clientes.filter(x=>(x.nombre+' '+x.telefono+' '+x.id).toLowerCase().includes(f));document.getElementById('clientes').innerHTML=`<div class="toolbar"><input id="fCli" placeholder="Buscar cliente…" value="${f}" oninput="renderClientes()"><button class="btn gold" onclick="abrirFormulario('cliente')">＋ Añadir cliente</button></div><div class="box">${tabla(['ID','CLIENTE','TELÉFONO','LÍMITE','SALDO','ACCIONES'],lista.map(x=>`<tr><td>${x.id}</td><td>${x.nombre}</td><td>${x.telefono||'—'}</td><td>${moneda(x.limite)}</td><td class="${x.saldo>0?'goldtxt':''}">${moneda(x.saldo)}</td><td><button class="btn" onclick="abonar('${x.id}')">Abono</button> <button class="btn" onclick="editar('cliente','${x.id}')">Editar</button> <button class="btn danger" onclick="borrar('cliente','${x.id}')">×</button></td></tr>`))}</div>`}
function renderVentas(){let f=document.getElementById('fVen')?.value||'';let lista=datos.ventas.filter(x=>x.fecha.includes(f)||x.cliente.toLowerCase().includes(f.toLowerCase())||x.producto.toLowerCase().includes(f.toLowerCase()));document.getElementById('ventas').innerHTML=`<div class="toolbar"><input id="fVen" placeholder="Filtrar fecha, cliente o producto…" value="${f}" oninput="renderVentas()"><button class="btn gold" onclick="abrirFormulario('venta')">＋ Registrar venta</button></div><div class="box">${tabla(['FECHA','CLIENTE','PRODUCTO','CANT.','MÉTODO','TOTAL','COBRADO','SALDO',''],lista.map(x=>`<tr><td>${x.fecha}</td><td>${x.cliente||'Venta directa'}</td><td>${x.producto}</td><td>${x.cantidad}</td><td>${x.metodo}</td><td>${moneda(x.total)}</td><td>${moneda(x.cobrado)}</td><td class="${x.saldo>0?'goldtxt':''}">${moneda(x.saldo)}</td><td><button class="btn danger" onclick="borrar('venta','${x.id}')">×</button></td></tr>`))}</div>`}
function renderEgresos(){let f=document.getElementById('fEg')?.value||'';let lista=datos.egresos.filter(x=>(x.categoria+' '+x.descripcion).toLowerCase().includes(f.toLowerCase()));document.getElementById('egresos').innerHTML=`<div class="toolbar"><input id="fEg" placeholder="Buscar egreso…" value="${f}" oninput="renderEgresos()"><button class="btn gold" onclick="abrirFormulario('egreso')">＋ Registrar egreso</button></div><div class="box">${tabla(['FECHA','CATEGORÍA','DESCRIPCIÓN','IMPORTE','ACCIONES'],lista.map(x=>`<tr><td>${x.fecha}</td><td>${x.categoria}</td><td>${x.descripcion}</td><td class="red">${moneda(x.monto)}</td><td><button class="btn" onclick="editar('egreso','${x.id}')">Editar</button> <button class="btn danger" onclick="borrar('egreso','${x.id}')">×</button></td></tr>`))}</div>`}
function renderBalance(){let filas=datos.cortes.map(x=>`<tr><td>${x.fecha}</td><td>${moneda(x.ventas)}</td><td>${moneda(x.cobrado)}</td><td>${moneda(x.egresos)}</td><td>${moneda(x.credito)}</td><td>${moneda(x.resultado)}</td><td><button class="btn danger" onclick="borrar('corte','${x.id}')">×</button></td></tr>`);document.getElementById('balance').innerHTML=`<div class="cards">${card('Ventas',moneda(totalVentas()),'Total registrado')}${card('Cobrado',moneda(totalCobrado()),'Total recibido','green')}${card('Egresos',moneda(totalEgresos()),'Total gastos','red')}${card('Deuda pendiente',moneda(porCobrar()),'Crédito de clientes','goldtxt')}</div><div class="cards">${card('Costo estimado vendido',moneda(costoVendido()),'Costo de productos')}${card('Utilidad estimada',moneda(utilidadEst()),'Cobrado − egresos − costo','green')}</div><div class="box"><h2>Cortes de balance</h2><p class="footnote">Un corte guarda una fotografía de los totales actuales; no elimina movimientos.</p><button class="btn gold" onclick="corte()">Guardar corte actual</button><div style="margin-top:17px">${tabla(['FECHA','VENTAS','COBRADO','EGRESOS','POR COBRAR','RESULTADO',''],filas)}</div></div>`}
function abrirFormulario(tipo,registro=null){let d=registro||{},titulo={producto:'Producto',cliente:'Cliente',venta:'Registrar venta',egreso:'Egreso'}[tipo];let campos='';if(tipo==='producto')campos=`<div class="field"><label>ID</label><input name="id" value="${d.id||''}" required></div><div class="field"><label>Perfume</label><input name="nombre" value="${d.nombre||''}" required></div><div class="field"><label>Marca</label><input name="marca" value="${d.marca||''}"></div><div class="field"><label>Costo unitario</label><input name="costo" type="number" min="0" step=".01" value="${d.costo??''}"></div><div class="field"><label>Precio venta</label><input name="precio" type="number" min="0" step=".01" value="${d.precio??''}" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="${d.stock??0}" required></div>`;if(tipo==='cliente')campos=`<div class="field"><label>ID cliente</label><input name="id" value="${d.id||''}" required></div><div class="field"><label>Nombre</label><input name="nombre" value="${d.nombre||''}" required></div><div class="field"><label>Teléfono</label><input name="telefono" value="${d.telefono||''}"></div><div class="field"><label>Límite crédito</label><input name="limite" type="number" min="0" step=".01" value="${d.limite??0}"></div>`;if(tipo==='egreso')campos=`<div class="field"><label>Fecha</label><input name="fecha" type="date" value="${d.fecha||fecha()}" required></div><div class="field"><label>Categoría</label><select name="categoria">${categorias.map(c=>`<option ${c===d.categoria?'selected':''}>${c}</option>`).join('')}</select></div><div class="field full"><label>Descripción</label><input name="descripcion" value="${d.descripcion||''}"></div><div class="field"><label>Importe</label><input name="monto" type="number" min="0.01" step=".01" value="${d.monto??''}" required></div>`;if(tipo==='venta')campos=`<div class="field"><label>Producto</label><select name="producto" required><option value="">Selecciona</option>${datos.productos.map(p=>`<option value="${p.id}">${p.nombre} · ${p.stock} disponibles · ${moneda(p.precio)}</option>`).join('')}</select></div><div class="field"><label>Cliente (opcional)</label><select name="cliente"><option value="">Venta directa</option>${datos.clientes.map(c=>`<option value="${c.id}">${c.nombre} · saldo ${moneda(c.saldo)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input name="cantidad" type="number" min="1" value="1" required></div><div class="field"><label>Método</label><select name="metodo"><option>Efectivo</option><option>Transferencia</option><option>Crédito de la casa</option></select></div><div class="field"><label>Fecha</label><input name="fecha" type="date" value="${fecha()}"></div><div class="field"><label>Vencimiento (crédito)</label><input name="vence" type="date" value="${fecha()}"></div>`;document.getElementById('modal').innerHTML=`<h2>${titulo}</h2><form id="form" class="formgrid">${campos}<div class="modalfoot full"><button type="button" class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn gold" type="submit">Guardar</button></div></form>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();procesar(tipo,new FormData(e.target),registro);};document.getElementById('modalbg').classList.remove('hidden')}
function procesar(tipo,f,d){let o=Object.fromEntries(f.entries());try{if(tipo==='producto'){o.costo=Number(o.costo||0);o.precio=Number(o.precio);o.stock=Number(o.stock);if(o.stock<0||o.precio<0)throw Error('Valores inválidos');let ix=datos.productos.findIndex(x=>x.id===o.id);if(ix>=0){if(d?.id&&d.id!==o.id)throw Error('ID duplicado');datos.productos[ix]=o}else{if(datos.productos.some(x=>x.id===o.id))throw Error('ID duplicado');datos.productos.push(o)}}if(tipo==='cliente'){o.limite=Number(o.limite||0);o.saldo=d?.saldo||0;if(datos.clientes.some(x=>x.id===o.id&&x.id!==d?.id))throw Error('ID duplicado');if(d){let ix=datos.clientes.findIndex(x=>x.id===d.id);datos.clientes[ix]=o}else datos.clientes.push(o)}if(tipo==='egreso'){o.monto=Number(o.monto);o.id=d?.id||id();if(d){let ix=datos.egresos.findIndex(x=>x.id===d.id);datos.egresos[ix]=o}else datos.egresos.push(o)}if(tipo==='venta'){let prod=datos.productos.find(x=>x.id===o.producto);if(!prod)throw Error('Producto inexistente');let cant=Number(o.cantidad);if(!Number.isInteger(cant)||cant<1)throw Error('Cantidad inválida');if(prod.stock<cant)throw Error('No hay stock suficiente');let cli=datos.clientes.find(x=>x.id===o.cliente);if(o.metodo==='Crédito de la casa'&&!cli)throw Error('Selecciona un cliente para la venta a crédito');let total=cant*Number(prod.precio),saldo=o.metodo==='Crédito de la casa'?total:0;prod.stock-=cant;datos.ventas.push({id:id(),fecha:o.fecha||fecha(),producto:prod.nombre,productoId:prod.id,cliente:cli?.nombre||'',clienteId:cli?.id||'',cantidad:cant,metodo:o.metodo,total,cobrado:total-saldo,saldo,costoUnitario:Number(prod.costo||0),vence:o.vence||''});if(cli){cli.saldo+=saldo;if(cli.saldo>cli.limite&&cli.limite>0)toast('Aviso: el cliente superó su límite de crédito.')}}guardar();cerrarModal();renderAll();toast('Registro guardado')}catch(err){toast(err.message)}}
function editar(tipo,idv){let arr={producto:datos.productos,cliente:datos.clientes,egreso:datos.egresos}[tipo];let d=arr.find(x=>x.id===idv);abrirFormulario(tipo,d)}function borrar(tipo,idv){if(!confirm('¿Eliminar este registro?'))return;if(tipo==='producto')datos.productos=datos.productos.filter(x=>x.id!==idv);if(tipo==='cliente'){let c=datos.clientes.find(x=>x.id===idv);if(c?.saldo) return toast('No se puede borrar un cliente con saldo pendiente.');datos.clientes=datos.clientes.filter(x=>x.id!==idv)}if(tipo==='egreso')datos.egresos=datos.egresos.filter(x=>x.id!==idv);if(tipo==='venta'){let v=datos.ventas.find(x=>x.id===idv);if(v.saldo>0)return toast('No se puede borrar una venta con saldo pendiente.');let prod=datos.productos.find(x=>x.id===v.productoId);if(prod)prod.stock+=v.cantidad;datos.ventas=datos.ventas.filter(x=>x.id!==idv)}if(tipo==='corte')datos.cortes=datos.cortes.filter(x=>x.id!==idv);guardar();renderAll()}
function abonar(idc){let c=datos.clientes.find(x=>x.id===idc);let monto=prompt(`Saldo actual: ${moneda(c.saldo)}\nMonto del abono:`);if(monto===null)return;monto=Number(monto);if(!(monto>0)||monto>c.saldo)return toast('Monto inválido');let restante=monto;for(let v of datos.ventas.filter(x=>x.clienteId===idc&&x.saldo>0).sort((a,b)=>a.fecha.localeCompare(b.fecha))){let aplicar=Math.min(restante,v.saldo);v.saldo-=aplicar;v.cobrado+=aplicar;restante-=aplicar;if(restante<=0)break}c.saldo=Math.max(0,c.saldo-monto);guardar();renderAll();toast('Abono aplicado')}
function corte(){datos.cortes.push({id:id(),fecha:fecha(),ventas:totalVentas(),cobrado:totalCobrado(),egresos:totalEgresos(),credito:porCobrar(),resultado:utilidadEst()});guardar();renderBalance();toast('Corte guardado')}function exportar(){let blob=new Blob([JSON.stringify({perfil,datos},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CL-Gestor-respaldo-'+fecha()+'.json';a.click();URL.revokeObjectURL(a.href)}function importar(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let j=JSON.parse(reader.result);if(!j.datos)throw Error('Respaldo inválido');if(confirm('Restaurar respaldo y reemplazar datos actuales?')){datos=j.datos;perfil=j.perfil||perfil;guardar();renderAll();toast('Respaldo restaurado')}}catch(e){toast('No se pudo leer el archivo')}};reader.readAsText(file)};input.click()}function modalRapido(){abrirFormulario('venta')}function cerrarModal(){document.getElementById('modalbg').classList.add('hidden')}function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
cargar();if(perfil){document.getElementById('perfilInput').value=perfil}
</script></body></html>
